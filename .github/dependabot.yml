version: 2
updates:
  - package-ecosystem: npm # also covers pnpm
    directory: /
    schedule:
      interval: weekly
    # Respect the project's policy of not adopting releases younger than two weeks
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
