name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the situation and who is affected (facilitator, participant, researcher).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
